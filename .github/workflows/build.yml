name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If your script uses external libraries (like pandas, requests, etc.), add them here like:
        # pip install requests

    - name: Build with PyInstaller
      run: |
        # If your script is inside a folder, include the folder path, e.g., email_finder_windows_build/main.py
        pyinstaller --onefile --noconsole email_finder_windows_build/main.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Executable
        path: dist/*.exe
