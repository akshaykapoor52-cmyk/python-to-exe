name: Build Python to EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller Spec Configuration
      run: |
        # Generate a spec file that collects all pandas and openpyxl dependencies
        pyinstaller --onefile --noconsole --collect-all pandas --collect-all openpyxl --name consolidate_reports consolidate_reports.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConsolidatedReport-EXE
        path: dist/consolidate_reports.exe
