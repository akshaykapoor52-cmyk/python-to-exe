name: Build Python to EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas==2.2.2 openpyxl==3.1.2 pyinstaller==6.6.0

    - name: Build with PyInstaller Spec File
      run: |
        pyinstaller consolidate_reports.spec

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConsolidatedReport-EXE
        path: dist/consolidate_reports.exe
