name: Build Excel Reporter EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub web interface

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "CreateConsolidatedReport" create_consolidated_report.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConsolidatedReport-EXE
        path: dist/CreateConsolidatedReport/
